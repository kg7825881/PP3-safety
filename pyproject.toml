[project]
name = "ppe-guard"
version = "0.1.0"
description = "Real-time PPE (helmet / vest) compliance detection, optimized for Apple Silicon edge inference."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ultralytics>=8.3",        # YOLO models: training, inference, export
    "torch>=2.4",              # deep learning runtime (MPS backend on Apple Silicon)
    "opencv-python>=4.10",     # video I/O and drawing
    "numpy>=1.26,<3",
    "pydantic>=2.7",           # typed, validated configuration
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ppe-guard = "ppe_guard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppe_guard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
